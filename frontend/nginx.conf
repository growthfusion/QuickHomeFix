server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;

    if ($request_uri ~ ^/(.*)\.html(\?|$)) {
        return 301 /$1;
    }

    if ($request_uri ~ ^/get-quotes\?service=([a-zA-Z0-9_-]+)) {
        return 301 /get-quotes/$1;
    }

    location = /get-quotes {
        return 302 /;
    }

    location = /get-quotes/ {
        return 302 /;
    }

    location ~ ^/get-quotes/[a-zA-Z0-9_-]+/?$ {
        add_header Cache-Control "no-cache";
        try_files /get-quotes.html =404;
    }

    # Variant routes: /get-quotes/:service/:variant (a, b, tt, etc.)
    location ~ ^/get-quotes/[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+/?$ {
        add_header Cache-Control "no-cache";
        try_files /get-quotes.html =404;
    }

    # Ping-post dashboard: a React SPA built into /ping-post. Its own
    # client-side routes (/ping-post/finance etc.) have no file on disk,
    # so unmatched paths fall back to its index.html rather than the
    # site's @catchall redirect to /.
    # Vite fingerprints these filenames, so they are safe to cache for good.
    location ^~ /ping-post/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /ping-post {
        try_files $uri $uri/ /ping-post/index.html;
    }

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ @catchall;
    }

    location @catchall {
        return 302 /;
    }

    # HTML/JS/CSS are not fingerprinted, so they must revalidate (cheap 304
    # via ETag) — a 1-year "immutable" lifetime left returning visitors on
    # the old version after a deploy.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # Fonts never change name — cache for 1 year
    location ~* \.(woff2|woff|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|webp|avif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
