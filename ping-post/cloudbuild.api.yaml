# Build + deploy the dashboard API (which also serves the built UI).
#
# There are two Dockerfiles in this repo, so `gcloud run deploy --source`
# cannot guess which one to use. This names it explicitly.
#
#   gcloud builds submit --config cloudbuild.api.yaml \
#     --substitutions=_REGION=us-central1,_CH_URL=https://host:8443
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - ${_IMAGE}
      - .

  - name: gcr.io/cloud-builders/docker
    args: [push, '${_IMAGE}']

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --service-account=${_SA}
      # Keep this private: responses carry affiliate payouts and buyer
      # revenue. Put IAP in front before making it reachable.
      - --no-allow-unauthenticated
      - --memory=512Mi
      - --set-env-vars=CLICKHOUSE_URL=${_CH_URL},CLICKHOUSE_DB=${_CH_DB},CLICKHOUSE_USER=${_CH_USER}
      - --set-secrets=CLICKHOUSE_PASSWORD=clickhouse-password:latest

substitutions:
  _SERVICE: hsp-api
  _REGION: us-central1
  _IMAGE: gcr.io/${PROJECT_ID}/hsp-api
  _SA: hsp-sync@${PROJECT_ID}.iam.gserviceaccount.com
  _CH_DB: ping_post
  _CH_USER: default
  _CH_URL: http://localhost:8123

images:
  - ${_IMAGE}
