# Build + deploy the ping-post dashboard API as its own Cloud Run
# service, from the QuickHomeFix repo.
#
# It reads ClickHouse only — the sync service owns the LeadProsper path
# and writes the ping_post database this queries. Point _CH_URL at the
# same ClickHouse the site uses; the database is separate.
#
#   gcloud builds submit ping-post/ --config cloudbuild.pingpost-api.yaml \
#     --substitutions _SERVICE=...,_IMAGE=...,_CH_URL=...,_ALLOWED_ORIGIN=...
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - ${_IMAGE}
      - .

  - name: gcr.io/cloud-builders/docker
    args: [push, '${_IMAGE}']

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --memory=512Mi
      # Reachable from the browser: the dashboard is a static SPA on the
      # main site and calls this directly. The UI guard at /ping-post
      # does not cover this origin — see SECURITY note in the repo.
      - --allow-unauthenticated
      - --set-env-vars=NODE_ENV=production,ALLOWED_ORIGIN=${_ALLOWED_ORIGIN},CLICKHOUSE_URL=${_CH_URL},CLICKHOUSE_DB=${_CH_DB},CLICKHOUSE_USER=${_CH_USER}
      - --set-secrets=CLICKHOUSE_PASSWORD=${_CH_SECRET}:latest

substitutions:
  _SERVICE: quickhomefix-pingpost-api
  _REGION: us-central1
  _IMAGE: gcr.io/${PROJECT_ID}/quickhomefix-pingpost-api
  _CH_DB: ping_post
  _CH_USER: default
  _CH_URL: ''
  # An existing project secret, shared with the main site.
  _CH_SECRET: CLICKHOUSE_PASSWORD
  # Origin of the site serving /ping-post. CORS rejects anything else.
  _ALLOWED_ORIGIN: ''

images:
  - ${_IMAGE}
