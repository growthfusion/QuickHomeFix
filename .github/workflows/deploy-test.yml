name: Deploy Test Environment

on:
  push:
    branches: [test]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.7
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2.1.4

      # Context is the repo root, not frontend/: the image also builds
      # the ping-post dashboard from ping-post/frontend and serves it
      # at /ping-post.
      - name: Build frontend image
        run: |
          gcloud builds submit . \
            --config cloudbuild.frontend.yaml \
            --substitutions _IMAGE=gcr.io/$PROJECT_ID/quickhomefix-frontend-test,_PING_POST_API=${{ secrets.PING_POST_API_URL_TEST }} \
            --project $PROJECT_ID

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy quickhomefix-frontend-test \
            --image gcr.io/$PROJECT_ID/quickhomefix-frontend-test \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --port 8080 \
            --project $PROJECT_ID

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.7
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2.1.4

      - name: Build backend image
        run: |
          gcloud builds submit backend/ \
            --tag gcr.io/$PROJECT_ID/quickhomefix-backend-test \
            --project $PROJECT_ID

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy quickhomefix-backend-test \
            --image gcr.io/$PROJECT_ID/quickhomefix-backend-test \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --port 8080 \
            --update-env-vars "NODE_ENV=test" \
            --project $PROJECT_ID

  # The ping-post dashboard API. Mirrors the prod job; separate service
  # and separate ClickHouse database from the public site's backend.
  deploy-pingpost-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.7
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2.1.4

      - name: Build and deploy ping-post API
        run: |
          gcloud builds submit ping-post/ \
            --config ping-post/cloudbuild.deploy.yaml \
            --substitutions _SERVICE=quickhomefix-pingpost-api-test,_IMAGE=gcr.io/$PROJECT_ID/quickhomefix-pingpost-api-test,_REGION=$REGION,_CH_URL=${{ secrets.CLICKHOUSE_URL }},_ALLOWED_ORIGIN=${{ secrets.SITE_ORIGIN_TEST }} \
            --project $PROJECT_ID

  # Pulls LeadProsper into the ping_post ClickHouse database the
  # dashboard reads. Cloud Scheduler POSTs /sync on a schedule; that
  # Scheduler job is a one-off setup step, not created here.
  deploy-pingpost-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.7
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2.1.4

      - name: Build and deploy ping-post sync
        run: |
          gcloud builds submit ping-post/ \
            --config ping-post/cloudbuild.sync.yaml \
            --substitutions _SERVICE=quickhomefix-pingpost-sync-test,_IMAGE=gcr.io/$PROJECT_ID/quickhomefix-pingpost-sync-test,_REGION=$REGION,_CH_URL=${{ secrets.CLICKHOUSE_URL }} \
            --project $PROJECT_ID
